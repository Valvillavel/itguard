<div class="min-h-screen h-screen flex bg-slate-100">
  <!-- Sidebar -->
  <app-sidebar
    class="h-full shrink-0"
    [isOpen]="sidebarOpen()"
    (closeEvent)="sidebarOpen.set(false)"
  />

  <!-- Overlay móvil -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-20 bg-black/50 lg:hidden" (click)="sidebarOpen.set(false)"></div>
  }

  <!-- Área principal -->
  <div class="flex flex-col flex-1 min-w-0 min-h-0">
    <!-- Topbar -->
    <app-topbar class="shrink-0" (menuToggle)="toggleSidebar()" />

    <!-- Contenido -->
    <main class="flex-1 min-h-0 overflow-auto">
      <div class="p-6 max-w-screen-2xl mx-auto min-h-full">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
