<header
  class="flex items-center h-16 px-4 lg:px-6 bg-white border-b border-slate-200 flex-shrink-0"
>
  <!-- Botón menú (móvil) -->
  <button
    (click)="menuToggle.emit()"
    class="lg:hidden p-2 rounded-lg text-slate-500 hover:text-slate-900 hover:bg-slate-100 transition-colors mr-3"
    aria-label="Abrir menú"
  >
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Nombre del sistema -->
  <div class="flex items-center gap-2">
    <div class="w-7 h-7 rounded-lg bg-blue-600 flex items-center justify-center">
      <svg
        class="w-4 h-4 text-white"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 3l8 4v5c0 4.5-3.4 7.9-8 9-4.6-1.1-8-4.5-8-9V7l8-4z"
        />
      </svg>
    </div>
    <span class="hidden sm:block text-sm font-semibold text-slate-800">ITGuard</span>
  </div>

  <div class="ml-auto flex items-center gap-3">
    <!-- Menú de usuario -->
    <div class="relative" data-user-menu>
      <button
        (click)="toggleUserMenu()"
        class="flex items-center gap-2.5 pl-2 pr-3 py-1.5 rounded-xl hover:bg-slate-100 transition-colors"
        aria-haspopup="true"
        [attr.aria-expanded]="userMenuOpen()"
      >
        <!-- Avatar -->
        <div
          class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-600 to-blue-700 flex items-center justify-center text-white text-xs font-bold flex-shrink-0"
        >
          {{ userInitials() }}
        </div>
        <div class="hidden sm:block text-left">
          <p class="text-sm font-medium text-slate-900 leading-none">{{ userName() }}</p>
          <p class="text-xs text-slate-500 mt-0.5">{{ user()?.role?.name ?? '' }}</p>
        </div>
        <svg
          class="w-4 h-4 text-slate-400 transition-transform"
          [class.rotate-180]="userMenuOpen()"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- Dropdown -->
      @if (userMenuOpen()) {
        <div
          class="absolute right-0 top-full mt-2 w-56 bg-white rounded-2xl shadow-xl border border-slate-100 py-2 z-50 animate-in fade-in slide-in-from-top-1 duration-150"
        >
          <!-- User info -->
          <div class="px-4 py-3 border-b border-slate-100">
            <p class="text-sm font-semibold text-slate-900 truncate">{{ userName() }}</p>
            <p class="text-xs text-slate-500 truncate mt-0.5">{{ user()?.email }}</p>
          </div>

          <div class="py-1">
            <a
              routerLink="/perfil"
              (click)="userMenuOpen.set(false)"
              class="flex items-center gap-3 px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 hover:text-slate-900 transition-colors"
            >
              <svg
                class="w-4 h-4 text-slate-400"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                />
              </svg>
              Mi perfil
            </a>
          </div>

          <div class="border-t border-slate-100 py-1">
            <button
              (click)="logout()"
              class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                />
              </svg>
              Cerrar sesión
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</header>
